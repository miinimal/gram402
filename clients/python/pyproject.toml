[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gram402"
version = "0.1.0"
description = "HTTP 402 payments for AI agents: GRAM on TON, PayPal spending mandates, NEAR mandate contracts. Clients, merchant paywall helper, MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "Aleksandr Shcherbakov", email = "artminiimal@gmail.com"}]
keywords = ["x402", "http-402", "ai-agents", "payments", "paypal", "near", "ton", "mcp"]
classifiers = ["Programming Language :: Python :: 3", "Intended Audience :: Developers", "Topic :: Internet :: WWW/HTTP"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
gram402-mandate-mcp = "mandate_mcp:main"

[project.urls]
Homepage = "https://github.com/miinimal/gram402"
Specification = "https://github.com/miinimal/gram402/blob/main/SPEC.md"

[tool.setuptools]
py-modules = ["gram402", "gram402_merchant", "minimalai_receipt", "paypal_mandate", "near_mandate", "mandate_mcp", "minimalai_registry"]
