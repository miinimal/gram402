name: ai-agent
# The AI shopper demo with a real LLM: the model decides what to buy, the server enforces the PayPal mandate
# (simulated PayPal API here). Any OpenAI-compatible endpoint: set repo secrets LLM_URL, LLM_KEY, LLM_MODEL.
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  shopper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r server/requirements.txt
      - name: LLM agent shops within a mandate
        env:
          LLM_URL: ${{ secrets.LLM_URL }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -o pipefail
          if [ -z "$LLM_URL" ]; then echo "LLM_URL secret not set: skipped"; exit 0; fi
          timeout 300 python3 demo/ai_shopper.py 2>&1 | tee shopper.log
          { echo '## AI shopper (real LLM)'; echo '```'; cat shopper.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
