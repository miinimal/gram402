name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install -r server/requirements.txt
      - run: cd server && python3 test_app.py
      - run: cd server && python3 test_paypal.py
      - run: cd server && python3 test_paypal_paywall.py
      - run: cd server && python3 test_paypal_concurrency.py
      - run: cd server && python3 test_near.py
      - run: cd server && python3 test_throttle.py
      - run: python3 clients/python/test_gram402.py
      - run: python3 clients/python/test_minimalai_receipt.py
      - run: python3 clients/python/test_minimalai_registry.py
      - run: python3 clients/python/test_gram402_merchant.py
      - run: python3 clients/python/test_paywall.py
      - run: python3 tools/test_x402probe.py
      - run: python3 tools/test_gram_real.py
      - run: python3 clients/python/test_paypal_mandate.py
      - run: python3 clients/python/test_near_mandate.py
      - run: timeout 60 python3 demo/paypal_agent_demo.py
      - run: timeout 60 python3 demo/ai_shopper.py
      - run: ./clients/typescript/test.sh
      - run: ./clients/typescript/test_merchant.sh
      - run: ./clients/typescript/test_paypal.sh
      - run: ./clients/typescript/test_near.sh
      - run: ./clients/typescript/test_registry.sh
      - name: PayPal sandbox live check (skipped without secrets)
        run: cd server && python3 smoke_paypal_sandbox.py
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
