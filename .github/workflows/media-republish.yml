name: media-republish
# Copies the owner-page recordings artifact of an earlier paypal-live run to the demo-media branch (for the video
# editor). Use when that run's own publish step did not push.
on:
  workflow_dispatch:
    inputs:
      run_id: {description: "paypal-live run id", required: true}
permissions:
  contents: write
  actions: read
jobs:
  republish:
    runs-on: ubuntu-24.04
    env:
      GIT_AUTHOR_NAME: github-actions
      GIT_AUTHOR_EMAIL: github-actions@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions
      GIT_COMMITTER_EMAIL: github-actions@users.noreply.github.com
    steps:
      - uses: actions/download-artifact@v4
        with: {name: owner-page-recordings, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}", path: rec}
      - run: |
          set -e
          sudo apt-get install -y -qq ffmpeg >/dev/null
          out=$RUNNER_TEMP/media/paypal-${{ inputs.run_id }}; mkdir -p "$out"; i=0
          for f in $(ls -tr rec/*.webm); do i=$((i+1))
            ffmpeg -nostdin -y -loglevel error -i "$f" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -r 30 "$out/owner-$i.mp4"; done
          cd "$RUNNER_TEMP/media"
          git init -q -b demo-media && git add . && git commit -qm "PayPal demo recordings, run ${{ inputs.run_id }}"
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" demo-media
          git rebase -q FETCH_HEAD
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:demo-media
