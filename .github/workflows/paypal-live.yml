name: paypal-live
# Live PayPal sandbox run of the agent demo. Needs repository secrets PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET
# (sandbox app); without them it runs against the simulated PayPal. Step "create" ends with a notice carrying the
# approval link: open it, log in with a PayPal sandbox buyer (Personal) account and approve. Step "run" waits up to
# 20 minutes for PayPal to report the approval, then the agent pays on its own; captures go to the job summary.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: paypal-live, cancel-in-progress: false}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_ENV: sandbox
      PAYPAL_SANDBOX_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r server/requirements.txt
      - name: create
        run: GRAM402_DB=$RUNNER_TEMP/demo.db DEMO_STATE=$RUNNER_TEMP/mandate.json DEMO_PHASE=create python3 demo/paypal_agent_demo.py
      - name: run
        run: GRAM402_DB=$RUNNER_TEMP/demo.db DEMO_STATE=$RUNNER_TEMP/mandate.json DEMO_PHASE=run python3 demo/paypal_agent_demo.py
