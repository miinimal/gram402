name: paypal-live
# Live PayPal sandbox run of the agent demo. Needs repository secrets PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET
# (sandbox app); without them it runs against the simulated PayPal. Step "create" ends with a notice carrying the
# approval link: open it, log in with a PayPal sandbox buyer (Personal) account and approve. Step "run" waits up to
# 20 minutes for PayPal to report the approval, then the agent pays on its own; captures go to the job summary and
# the owner page is screen-recorded (artifact owner-page-recordings) for the demo video.
on:
  workflow_dispatch:
permissions:
  contents: write  # only to push the recordings to the demo-media branch
concurrency: {group: paypal-live, cancel-in-progress: false}
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_ENV: sandbox
      PAYPAL_SANDBOX_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r server/requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: create
        run: GRAM402_DB=$RUNNER_TEMP/demo.db DEMO_STATE=$RUNNER_TEMP/mandate.json DEMO_RECORD_DIR=$RUNNER_TEMP/rec DEMO_PHASE=create python3 demo/paypal_agent_demo.py | tee $RUNNER_TEMP/create.log
      - name: run
        run: GRAM402_DB=$RUNNER_TEMP/demo.db DEMO_STATE=$RUNNER_TEMP/mandate.json DEMO_RECORD_DIR=$RUNNER_TEMP/rec DEMO_PHASE=run python3 demo/paypal_agent_demo.py | tee $RUNNER_TEMP/rec/run.log
      - name: recordings of the owner page (sandbox; the mandate is revoked at the end of the run)
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: owner-page-recordings, path: "${{ runner.temp }}/rec/*.webm", if-no-files-found: ignore, retention-days: 14}
      - name: publish recordings to the demo-media branch (for the video editor; no code)
        if: always()
        run: |
          set -e
          ls "$RUNNER_TEMP"/rec/*.webm >/dev/null 2>&1 || exit 0
          sudo apt-get install -y -qq ffmpeg >/dev/null
          out=$RUNNER_TEMP/media/paypal-${{ github.run_id }}; mkdir -p "$out"; i=0
          for f in $(ls -tr "$RUNNER_TEMP"/rec/*.webm); do i=$((i+1))
            ffmpeg -nostdin -y -loglevel error -i "$f" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -r 30 "$out/owner-$i.mp4"; done
          cp "$RUNNER_TEMP"/rec/*.log "$out/" 2>/dev/null || true
          cd "$RUNNER_TEMP/media"
          git init -q -b demo-media && git add .
          export GIT_AUTHOR_NAME=github-actions GIT_AUTHOR_EMAIL=github-actions@users.noreply.github.com GIT_COMMITTER_NAME=github-actions GIT_COMMITTER_EMAIL=github-actions@users.noreply.github.com
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "PayPal demo recordings, run ${{ github.run_id }}"
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" demo-media && git rebase -q FETCH_HEAD || true
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:demo-media
